name: Staff and moderation regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend test:unit
      # The harness creates isolated local PostgreSQL databases; no production credentials are used.
      - run: pnpm --filter backend test:integration --maxWorkers=2
      - run: pnpm --filter frontend exec tsc --noEmit
      - run: pnpm --filter frontend test
